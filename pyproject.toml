[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seoaudit"
version = "0.1.0"
description = "Technical SEO site audit CLI. Crawl a site, score issues, and write a report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "John Shum" }]
keywords = ["seo", "crawler", "technical-seo", "audit", "sitemap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Internet :: WWW/HTTP :: Site Management :: Link Checking",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[project.scripts]
seoaudit = "seoaudit.cli:main"

[project.urls]
Homepage = "https://github.com/photosnob/seo-audit-cli"
Repository = "https://github.com/photosnob/seo-audit-cli"
Issues = "https://github.com/photosnob/seo-audit-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seoaudit = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Prose in issue descriptions and the HTML report is kept readable rather than
# hard-wrapped at 100 columns. The formatter still owns layout.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["seoaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["seoaudit"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["bs4", "bs4.*"]
ignore_missing_imports = true
